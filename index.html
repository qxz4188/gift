<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>正在打开礼物…</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://halloween-gift-04452.app.workbuddy.host/?sharecode=GOFQIYPOLL" />
<meta http-equiv="refresh" content="1; url=https://halloween-gift-04452.app.workbuddy.host/?sharecode=GOFQIYPOLL" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #faf8ff 42%, #efeafa 76%, #e3dcf5 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .box {
    text-align: center; padding: 0 28px;
    animation: pop .6s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  .heart {
    font-size: 54px; line-height: 1;
    display: inline-block;
    animation: beat 1.1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    18% { transform: scale(1.16); }
    36% { transform: scale(.96); }
    54% { transform: scale(1.09); }
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { margin-top: 18px; font-size: 17px; font-weight: 600; color: #5b4a6b; letter-spacing: .5px; }
  p { margin-top: 10px; font-size: 13px; color: #9a8fa8; line-height: 1.7; }
  a.btn {
    display: inline-block; margin-top: 22px; padding: 11px 26px;
    font-size: 14px; font-weight: 600; color: #fff; text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff7aa8, #ff4d88);
    box-shadow: 0 8px 22px rgba(255, 77, 136, .38);
    transition: transform .15s ease;
  }
  a.btn:active { transform: scale(.95); }
  .dots { margin-top: 26px; display: flex; gap: 7px; justify-content: center; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%; background: #ff8fc7; opacity: .35;
    animation: fade 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes fade { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
</style>
</head>
<body>
  <div class="box">
    <div class="heart">🎁</div>
    <h1>正在为你打开惊喜…</h1>
    <p>如果没有自动跳转，点下面的按钮</p>
    <a class="btn" id="go" href="https://halloween-gift-04452.app.workbuddy.host/?sharecode=GOFQIYPOLL">打开礼物</a>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <script>
    // 双保险：meta refresh 之外再补一次 JS 跳转，并把当前查询参数带过去（如果目标本身没有参数）
    (function () {
      var target = 'https://halloween-gift-04452.app.workbuddy.host/?sharecode=GOFQIYPOLL';
      setTimeout(function () { location.replace(target); }, 800);
    })();
  </script>
</body>
</html>
